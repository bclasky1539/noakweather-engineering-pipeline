name: Sonar verify / SonarCloud Analysis
on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  sonarcloud:
    name: SonarCloud Analysis (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ matrix.java-version }}
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ matrix.java-version }}
          restore-keys: ${{ runner.os }}-m2
      - name: Verify SONAR_TOKEN exists
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "SONAR_TOKEN secret is not set!"
            exit 1
          else
            echo "SONAR_TOKEN is configured"
          fi
      # Build legacy module
      - name: Build legacy module
        run: |
          cd noakweather-legacy
          mvn clean install

      # Build platform modules
      - name: Build platform modules
        run: |
          cd noakweather-platform
          mvn clean verify
      # Analyze once, on the leg that matches the compile target (maven.compiler.release 17)
      - name: SonarCloud Analysis
        if: matrix.java-version == 17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd noakweather-platform
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=bclasky1539_noakweather-engineering-pipeline \
            -Dsonar.organization=bclasky1539 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectName="Noakweather Engineering Pipeline" \
            -Dsonar.java.source=17

      # Poll/report the Quality Gate on the leg that ran the analysis (Java 17)
      - name: SonarQube Quality Gate Check
        if: matrix.java-version == 17
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        with:
          scanMetadataReportFile: noakweather-platform/target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
